<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kidney MD – Waiting Room Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #2D4A6E;
      --navy-dk: #1a2f47;
      --crimson: #8B2020;
      --white:   #ffffff;
      --gray:    rgba(255,255,255,0.55);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--navy-dk);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Background ──────────────────────────────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 40%, rgba(45,74,110,0.9) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(26,47,71,0.8) 0%, transparent 65%),
        var(--navy-dk);
    }

    /* Subtle geometric pattern overlay */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,0.018) 0px,
          rgba(255,255,255,0.018) 1px,
          transparent 1px,
          transparent 60px
        );
      pointer-events: none;
    }

    /* ── Clock bar (top) ─────────────────────────────────────── */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      background: rgba(26,47,71,0.85);
      border-bottom: 3px solid var(--crimson);
      backdrop-filter: blur(8px);
      z-index: 50;
    }

    .top-bar-logo {
      height: 57px;
      width: auto;
      object-fit: contain;
      opacity: .92;
    }

    .top-bar-clock {
      font-size: 28px;
      font-weight: 400;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Centered watermark logo — removed ──────────────────── */
    .center-content {
      display: none;
    }

    .watermark-logo {
      display: none;
    }

    .watermark-tagline {
      display: none;
    }

    /* ── Notification queue ──────────────────────────────────── */
    #notif-queue {
      position: fixed;
      bottom: 56px;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 100;
      pointer-events: none;
    }

    .notif-banner {
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(26,47,71,0.96);
      border-left: 8px solid var(--crimson);
      border-radius: 18px;
      padding: 28px 44px;
      max-width: 1100px;
      width: 90vw;
      box-shadow:
        0 8px 60px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.06);
      animation: slideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      backdrop-filter: blur(12px);
    }

    .notif-banner.dismissing {
      animation: fadeOut 0.5s ease forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-16px) scale(0.96); }
    }

    .notif-icon {
      flex-shrink: 0;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(139,32,32,0.2);
      border: 2px solid rgba(139,32,32,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notif-icon svg { width: 34px; height: 34px; }

    .notif-text { flex: 1; min-width: 0; }

    .notif-headline {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(28px, 3.5vw, 48px);
      color: var(--white);
      line-height: 1.2;
      font-weight: 500;
    }

    .notif-sub {
      font-size: clamp(18px, 2vw, 26px);
      color: var(--gray);
      margin-top: 8px;
      line-height: 1.4;
    }

    .notif-progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 4px;
      background: var(--crimson);
      border-radius: 0 0 0 18px;
      width: 100%;
      transform-origin: left;
      animation: shrink var(--duration, 9s) linear forwards;
    }

    @keyframes shrink {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }

    .notif-banner { position: relative; overflow: hidden; }

    /* ── Connection status dot ───────────────────────────────── */
    #ws-status {
      position: fixed;
      bottom: 20px;
      right: 28px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      pointer-events: none;
    }

    #ws-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #555;
      transition: background .4s;
    }
    #ws-dot.connected { background: #4ade80; }
    #ws-dot.error     { background: #ef4444; }

    /* ── Idle subtle pulse on watermark ─────────────────────── */
    @keyframes idlePulse {
      0%,100% { opacity: 0.07; }
      50%      { opacity: 0.11; }
    }
    .watermark-logo { animation: idlePulse 6s ease-in-out infinite; }

    /* ── Video player (full-screen background) ───────────────── */
    #video-bg {
      position: fixed;
      inset: 72px 0 0 0;       /* sits below the top bar */
      z-index: 5;               /* above .bg, below center-content & banners */
      background: #000;
      overflow: hidden;
    }

    #video-bg video {
      width: 100%;
      height: 100%;
      object-fit: contain;      /* letterbox — keeps full video visible */
      display: block;
    }

    /* Dark overlay so logo/banners stay readable over bright video */
    #video-overlay {
      position: fixed;
      inset: 72px 0 0 0;
      z-index: 6;
      background: rgba(0,0,0,0.28);
      pointer-events: none;
    }

    /* Video title card — hidden */
    #video-title { display: none; }

    /* ── Video fallback message ──────────────────────────────── */
    /* Shown full-screen (in place of the video area) when every  */
    /* video in the playlist has failed to load, so the TV never  */
    /* just goes black/blank with no explanation.                 */
    #video-fallback {
      position: fixed;
      inset: 72px 0 0 0;
      z-index: 7;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      background: var(--navy-dk);
      text-align: center;
      padding: 40px;
    }
    #video-fallback .fallback-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(139,32,32,0.2);
      border: 2px solid rgba(139,32,32,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    #video-fallback .fallback-icon svg { width: 40px; height: 40px; }
    #video-fallback .fallback-headline {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(26px, 3vw, 40px);
      color: var(--white);
      font-weight: 500;
    }
    #video-fallback .fallback-sub {
      font-size: clamp(16px, 1.6vw, 22px);
      color: var(--gray);
      max-width: 600px;
    }

    /* Fade-transition between videos */
    @keyframes videoFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    #video-bg.transitioning video { animation: videoFadeIn 1.2s ease forwards; }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg"></div>

<!-- ── Video background playlist ─────────────────────────────────── -->
<div id="video-bg">
  <video id="main-video" muted playsinline autoplay></video>
</div>
<div id="video-overlay"></div>

<!-- Fallback message shown if all videos in the playlist fail to load -->
<div id="video-fallback">
  <div class="fallback-icon">
    <svg viewBox="0 0 48 48" fill="none"><path d="M24 16v12M24 32h.01" stroke="#ef9f9f" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="24" r="18" stroke="#ef9f9f" stroke-width="3"/></svg>
  </div>
  <div class="fallback-headline">Video content unavailable</div>
  <div class="fallback-sub" id="fallback-sub-text">We're having trouble loading the waiting room videos. Retrying shortly…</div>
</div>

<div id="video-title"></div>

<!-- Top bar: logo + clock -->
<div class="top-bar">
  <img class="top-bar-logo" id="top-logo" src="" alt="Kidney MD" />
  <div class="top-bar-clock" id="live-clock">—</div>
</div>

<!-- Centered watermark -->
<div class="center-content">
  <img class="watermark-logo" id="wm-logo" src="" alt="" aria-hidden="true" />
  <div class="watermark-tagline">Focused on a Healthier You</div>
</div>

<!-- Notification queue — banners appear here -->
<div id="notif-queue"></div>

<!-- WebSocket status -->
<div id="ws-status">
  <div id="ws-dot"></div>
  <span id="ws-label">connecting…</span>
</div>

<script>
  // ══════════════════════════════════════════════════════════════
  //  VIDEO PLAYLIST
  //  ─────────────────────────────────────────────────────────────
  //  HOW TO UPDATE (GitHub Pages):
  //  1. In your GitHub repo, upload each MP4 file alongside this
  //     HTML file (same folder / root of the repo).
  //     ⚠️  GitHub web UI only allows files up to 25 MB per upload.
  //     For larger videos, use GitHub Desktop app or Git LFS.
  //     GitHub hard limit per file is 100 MB.
  //  2. Add each filename exactly as uploaded to the VIDEOS array
  //     below (case-sensitive, spaces are fine, and don't forget
  //     the comma between entries!).
  //  3. Commit — the page updates automatically within ~1 minute.
  //
  //  The playlist plays in the exact order listed below, then
  //  loops back to the first video and repeats — no shuffling,
  //  so every video gets an equal turn before any repeats.
  // ══════════════════════════════════════════════════════════════
  var VIDEOS = [
    'Alkaline water.mp4',
    'Body Comp Video.mp4',
    'DSC difference.mp4',
    'GFR.mp4',
    'Insurance and OON.mp4',
    'Keystone habits.mp4',
    'Living with CKD.mp4',
    'NEAT.mp4',
    'Obesity and Kidneys.mp4',
    'Obesity.mp4',
    'OON care.mp4',
    'Protein Myth.mp4',
    'ItchingCKD.mp4',
    'HydrogenWater.mp4'
  ];

  var playlist   = VIDEOS.slice(); // play in listed order, no shuffle
  var playIndex  = 0;
  var videoEl    = document.getElementById('main-video');
  var videoBg    = document.getElementById('video-bg');
  var videoTitle = document.getElementById('video-title');

  // Fallback UI elements + failure tracking
  var videoFallback       = document.getElementById('video-fallback');
  var fallbackSubText     = document.getElementById('fallback-sub-text');
  var consecutiveFailures = 0;
  var retryTimer          = null;
  var RETRY_DELAY_MS      = 30000; // how long to wait before retrying the whole playlist after total failure

  function showFallback(message) {
    if (message) fallbackSubText.textContent = message;
    videoFallback.style.display = 'flex';
  }
  function hideFallback() {
    videoFallback.style.display = 'none';
  }

  function friendlyName(filename) {
    // Strips extension and converts underscores/hyphens to spaces
    return filename.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ');
  }

  function loadVideo(index) {
    var src = playlist[index];
    videoBg.classList.add('transitioning');
    videoEl.src = src;
    videoEl.load();
    videoEl.play().catch(function() {
      // Autoplay blocked — retry on next user interaction
      document.addEventListener('click', function retry() {
        videoEl.play();
        document.removeEventListener('click', retry);
      });
    });
    videoTitle.textContent = friendlyName(src);
    setTimeout(function() { videoBg.classList.remove('transitioning'); }, 1300);
  }

  videoEl.addEventListener('ended', function() {
    playIndex = (playIndex + 1) % playlist.length;
    loadVideo(playIndex);
  });

  videoEl.addEventListener('error', function() {
    console.warn('Video error, skipping:', playlist[playIndex]);
    consecutiveFailures++;

    if (consecutiveFailures >= playlist.length) {
      // Every video in the playlist has failed in a row — the screen
      // would otherwise just go black. Show an on-screen message
      // instead, and quietly retry the whole playlist periodically.
      showFallback('We\u2019re having trouble loading the waiting room videos. Retrying shortly\u2026');
      if (!retryTimer) {
        retryTimer = setTimeout(function() {
          retryTimer = null;
          consecutiveFailures = 0;
          playIndex = 0;
          loadVideo(playIndex);
        }, RETRY_DELAY_MS);
      }
      return; // don't immediately hammer through the list again
    }

    playIndex = (playIndex + 1) % playlist.length;
    loadVideo(playIndex);
  });

  videoEl.addEventListener('playing', function() {
    // A video is actually playing — clear any failure state/fallback
    consecutiveFailures = 0;
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    hideFallback();
  });

  // Start the first video
  if (playlist.length > 0) {
    loadVideo(0);
  } else {
    showFallback('No videos are configured for this display.');
  }

  // ══════════════════════════════════════════════════════════════
  //  LIVE CLOCK
  // ══════════════════════════════════════════════════════════════
  function fmt12(d) {
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
  }
  function updateClock() {
    var el = document.getElementById('live-clock');
    if (!el) return;
    var now = new Date();
    el.textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
      + '   ·   ' + fmt12(now);
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ══════════════════════════════════════════════════════════════
  //  NOTIFICATION DISPLAY
  // ══════════════════════════════════════════════════════════════
  var queue = document.getElementById('notif-queue');

  function iconSvg(type) {
    if (type === 'check') return '<svg viewBox="0 0 48 48" fill="none"><path d="M10 24l10 10 18-18" stroke="#ef9f9f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    if (type === 'kiosk') return '<svg viewBox="0 0 48 48" fill="none"><rect x="10" y="6" width="28" height="36" rx="5" stroke="#ef9f9f" stroke-width="3"/><path d="M18 14h12M18 20h8" stroke="#ef9f9f" stroke-width="2.5" stroke-linecap="round"/><rect x="16" y="34" width="16" height="3" rx="1.5" fill="#ef9f9f"/></svg>';
    if (type === 'video') return '<svg viewBox="0 0 48 48" fill="none"><rect x="4" y="12" width="28" height="24" rx="5" stroke="#ef9f9f" stroke-width="3"/><path d="M32 19l12-7v24l-12-7V19z" stroke="#ef9f9f" stroke-width="3" stroke-linejoin="round"/></svg>';
    return '<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="18" stroke="#ef9f9f" stroke-width="3"/></svg>';
  }

  var activeTimer   = null;   // single timer — only one banner at a time
  var activeBanner  = null;   // reference to the currently visible banner

  function clearCurrentBanner() {
    if (activeTimer)  { clearTimeout(activeTimer);  activeTimer  = null; }
    if (activeBanner) {
      activeBanner.classList.add('dismissing');
      var old = activeBanner;
      setTimeout(function() { if (old.parentNode) old.parentNode.removeChild(old); }, 500);
      activeBanner = null;
    }
  }

  function showNotification(config) {
    // Immediately remove any existing banner before showing the new one
    clearCurrentBanner();

    var banner = document.createElement('div');
    banner.className = 'notif-banner';

    banner.innerHTML =
      '<div class="notif-icon">' + iconSvg(config.icon) + '</div>' +
      '<div class="notif-text">' +
        '<div class="notif-headline">' + config.headline + '</div>' +
        (config.sub ? '<div class="notif-sub">' + config.sub + '</div>' : '') +
      '</div>' +
      '<div class="notif-progress" style="--duration:' + (DISPLAY_DURATION_MS / 1000) + 's"></div>';

    queue.insertBefore(banner, queue.firstChild);
    activeBanner = banner;

    // Auto-dismiss after duration
    activeTimer = setTimeout(function() {
      clearCurrentBanner();
    }, DISPLAY_DURATION_MS);
  }

  // ══════════════════════════════════════════════════════════════
  //  WEBSOCKET CONNECTION
  // ══════════════════════════════════════════════════════════════
  var ws = null;
  var wsReconnectDelay = 3000;
  var wsDot   = document.getElementById('ws-dot');
  var wsLabel = document.getElementById('ws-label');

  function setWsStatus(state) {
    wsDot.className = '';
    if (state === 'connected') {
      wsDot.classList.add('connected');
      wsLabel.textContent = 'live';
    } else if (state === 'error') {
      wsDot.classList.add('error');
      wsLabel.textContent = 'reconnecting…';
    } else {
      wsLabel.textContent = 'connecting…';
    }
  }

  function connectWs() {
    setWsStatus('connecting');
    ws = new WebSocket(NTFY_BASE + NTFY_TOPIC + '/ws');

    ws.onopen = function() {
      setWsStatus('connected');
      wsReconnectDelay = 3000;
    };

    ws.onmessage = function(event) {
      try {
        var data = JSON.parse(event.data);
        if (data.event !== 'message') return;
        var title = (data.title || '').toLowerCase().trim();
        if (MESSAGES[title]) {
          showNotification(MESSAGES[title]);
        }
      } catch(e) {}
    };

    ws.onerror = function() { setWsStatus('error'); };

    ws.onclose = function() {
      setWsStatus('error');
      setTimeout(function() {
        wsReconnectDelay = Math.min(wsReconnectDelay * 1.5, 30000);
        connectWs();
      }, wsReconnectDelay);
    };
  }

  // Reconnect when Fire Stick un-backgrounds the browser
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      if (!ws || ws.readyState === WebSocket.CLOSED) connectWs();
    }
  });

  // Keepalive ping to prevent Silk from sleeping the WebSocket
  setInterval(function() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      // Sending a zero-length payload just to keep the connection active
      try { ws.send(''); } catch(e) {}
    }
  }, 20000);

  connectWs();

  // ══════════════════════════════════════════════════════════════
  //  KEEP-AWAKE — prevents Fire Stick / Silk from sleeping
  //  Scrolls 1px up and back every 30 s to simulate activity
  // ══════════════════════════════════════════════════════════════
  setInterval(function() {
    window.scrollBy(0, 1);
    setTimeout(function() { window.scrollBy(0, -1); }, 200);
  }, 30000);

  // ══════════════════════════════════════════════════════════════
  //  VIDEO LOOP WATCHDOG
  //  If the video stalls or pauses unexpectedly, restart it.
  //  Checks every 10 s; if the video hasn't advanced at all,
  //  it skips to the next track.
  // ══════════════════════════════════════════════════════════════
  var lastTime = -1;
  var stallCount = 0;
  setInterval(function() {
    if (!videoEl.paused && !videoEl.ended) {
      if (videoEl.currentTime === lastTime) {
        stallCount++;
        if (stallCount >= 2) {          // stalled for ~20 s → skip
          stallCount = 0;
          playIndex = (playIndex + 1) % playlist.length;
          loadVideo(playIndex);
        }
      } else {
        stallCount = 0;
      }
      lastTime = videoEl.currentTime;
    } else if (videoEl.paused && !videoEl.ended) {
      // Paused unexpectedly — try to resume
      videoEl.play().catch(function() {});
    }
  }, 10000);

  // ══════════════════════════════════════════════════════════════
  //  CURSOR HIDE — move Fire TV remote pointer to bottom-left
  //  on load so it's out of the way.  Uses a synthetic
  //  mousemove to nudge the on-screen pointer off-screen.
  // ══════════════════════════════════════════════════════════════
  window.addEventListener('load', function() {
    var evt = new MouseEvent('mousemove', {
      bubbles: true, cancelable: true,
      clientX: 0, clientY: window.innerHeight
    });
    document.dispatchEvent(evt);
  });

  // ══════════════════════════════════════════════════════════════
  //  PAGE-LEVEL AUTO-RECOVERY
  //  If the page somehow fully freezes (video stalls AND watchdog
  //  fails), this forces a full reload after 2 hours as a last
  //  resort. The video watchdog above handles normal stalls.
  // ══════════════════════════════════════════════════════════════
  var lastActivity = Date.now();

  // Any video progress resets the activity timer
  videoEl.addEventListener('timeupdate', function() {
    lastActivity = Date.now();
  });

  setInterval(function() {
    // If no video progress for 2 hours, reload the page
    if (Date.now() - lastActivity > 2 * 60 * 60 * 1000) {
      window.location.reload();
    }
  }, 5 * 60 * 1000); // check every 5 minutes
</script>
</body>
</html>
