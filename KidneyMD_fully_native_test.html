<!doctype html>
<html><head><meta charset="utf-8"><title>Fully native video test</title>
<style>
  html,body{margin:0;background:#0b1220;color:#fff;font:30px/1.4 sans-serif}
  #log{padding:24px;white-space:pre-wrap}
  .ok{color:#7CFC9A}.bad{color:#ff8a8a}
</style></head>
<body>
<div id="log">Starting…</div>
<script>
// EXPERIMENT: asks Fully Kiosk's built-in (non-WebView) player to play one video.
// Needs: Fully PLUS (trial works, with watermark) + Settings > Advanced Web
// Settings > "Enable JavaScript Interface (PLUS)" turned ON.
// The argument list below is from memory and is NOT verified against Fully's docs,
// so this page prints exactly what happens instead of assuming it worked.

var VIDEO = 'GFR.mp4';   // same folder as this page
var logEl = document.getElementById('log');
function say(msg, cls){ logEl.innerHTML += '\n<span class="'+(cls||'')+'">'+msg+'</span>'; }

// Turn the relative name into a full web address (the native player needs one)
var url = new URL(VIDEO, location.href).href;
logEl.textContent = 'Page address:\n' + location.href + '\n\nVideo address:\n' + url;

if (typeof fully === 'undefined') {
  say('\n✗ "fully" is not available. Turn on Settings > Advanced Web Settings > Enable JavaScript Interface (PLUS), then reload.', 'bad');
} else {
  say('\n✓ Fully JavaScript interface found.', 'ok');
  say('playVideo function present: ' + (typeof fully.playVideo), typeof fully.playVideo === 'function' ? 'ok' : 'bad');
  if (typeof fully.playVideo === 'function') {
    setTimeout(function(){
      try {
        // (url, loop, showControls, exitOnTouch, exitOnCompletion)
        var r = fully.playVideo(url, false, false, false, true);
        say('Called playVideo. Returned: ' + String(r), 'ok');
      } catch (e) {
        say('✗ playVideo threw: ' + e, 'bad');
      }
    }, 1500);
  }
}
</script>
</body></html>
