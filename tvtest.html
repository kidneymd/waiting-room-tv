<!doctype html>
<html><head><meta charset="utf-8"><title>Stop-video test</title>
<style>
  html,body{margin:0;background:#0b1220;color:#fff;font:30px/1.5 sans-serif}
  #log{padding:24px;white-space:pre-wrap}
  .ok{color:#7CFC9A}.bad{color:#ff8a8a}.dim{color:#9fb0cc}
</style></head>
<body><div id="log"></div>
<script>
// DIAGNOSTIC: answers two questions about Fully's native player on this stick.
//  1) Does the page's JavaScript keep running while the native video plays?
//  2) Does fully.stopVideo() actually close the player?
// It starts GFR.mp4, calls stopVideo() at 15 s and bringToForeground() at 30 s, and reports what happened.
var VIDEO = 'GFR.mp4';
var logEl = document.getElementById('log');
var t0 = Date.now();
function sec(){ return ((Date.now()-t0)/1000).toFixed(1); }
function say(m,c){ logEl.innerHTML += '<div class="'+(c||'')+'">['+sec()+'s] '+m+'</div>'; }

var ticks = 0, stopCalledAt = null, stopResult = '', fgCalledAt = null, fgResult = '', playerBackAt = null;
setInterval(function(){ ticks++; }, 1000);

if (typeof fully === 'undefined' || typeof fully.playVideo !== 'function') {
  say('Fully JavaScript interface NOT available. Turn on "Enable JavaScript Interface (PLUS)".', 'bad');
} else {
  say('Starting video through the native player…');
  setTimeout(function(){
    fully.playVideo(new URL(VIDEO, location.href).href, false, false, false, true);
  }, 2000);

  // Call stopVideo after 15 s (only runs if the page JavaScript is alive)
  setTimeout(function(){
    stopCalledAt = sec();
    try { fully.stopVideo(); stopResult = 'ok'; } catch(e){ stopResult = 'threw: '+e; }
  }, 17000);

  // Second attempt at 30 s if the player is still up: ask Fully to bring itself to the front.
  setTimeout(function(){
    fgCalledAt = sec();
    try {
      if (typeof fully.bringToForeground === 'function') { fully.bringToForeground(); fgResult = 'ok'; }
      else fgResult = 'bringToForeground not available';
    } catch(e){ fgResult = 'threw: '+e; }
  }, 32000);

  say('Functions present: stopVideo=' + typeof fully.stopVideo + ', bringToForeground=' + typeof fully.bringToForeground);

  function back(){
    if (document.visibilityState === 'hidden' || playerBackAt !== null) return;
    playerBackAt = sec();
    var elapsed = parseFloat(playerBackAt);
    say('Page is visible again at ' + playerBackAt + ' s.', 'ok');
    say('JavaScript timer ticks counted: ' + ticks + ' (about ' + Math.round(elapsed) + ' expected if the page kept running)',
        ticks >= elapsed*0.8 ? 'ok' : 'bad');
    say('stopVideo() was ' + (stopCalledAt ? 'called at ' + stopCalledAt + ' s (' + stopResult + ')' : 'NEVER called'),
        stopCalledAt ? 'ok' : 'bad');
    if (fgCalledAt) say('bringToForeground() was called at ' + fgCalledAt + ' s (' + fgResult + ')');
    if (stopCalledAt && elapsed < parseFloat(stopCalledAt) + 5) say('RESULT: stopVideo() closed the player.', 'ok');
    else if (fgCalledAt && elapsed >= parseFloat(fgCalledAt) && elapsed < parseFloat(fgCalledAt) + 5) say('RESULT: stopVideo() did NOT work, but bringToForeground() closed the player.', 'ok');
    else if (!stopCalledAt) say('RESULT: page JavaScript was frozen while the video played.', 'bad');
    else say('RESULT: neither stopVideo() nor bringToForeground() closed the player (the video ended on its own).', 'bad');
  }
  document.addEventListener('visibilitychange', back);
  window.addEventListener('focus', back);
}
</script></body></html>
